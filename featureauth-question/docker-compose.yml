services:
  mysql:
    image: mysql:8.0
    container_name: online-exam-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: online_exam
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # sql 目录按文件名顺序执行：00-auth -> 01-question -> 04-seed
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root123456}" ]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    container_name: online-exam-backend
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: online_exam
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      JWT_SECRET: ${JWT_SECRET:-online-exam-dev-secret-please-change-in-production}
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: online-exam-frontend
    depends_on:
      - backend
    ports:
      - "8088:80"

volumes:
  mysql-data:
