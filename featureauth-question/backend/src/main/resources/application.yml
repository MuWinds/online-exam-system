server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: online-exam-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 数据库连接信息全部通过环境变量覆盖，避免把真实密码提交到仓库
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:online_exam}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  jwt:
    # 生产环境必须通过环境变量 JWT_SECRET 覆盖，长度建议不小于 32 位
    secret: ${JWT_SECRET:online-exam-dev-secret-please-change-in-production}
    expire-seconds: ${JWT_EXPIRE_SECONDS:7200}
  # 管理员新增用户未填写密码时使用的初始密码
  default-password: ${DEFAULT_PASSWORD:123456}

logging:
  level:
    com.ustb.exam: info
