spring:
  datasource:
    url: jdbc:h2:mem:task3;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:task2-demo.sql,classpath:task2.sql,classpath:task3.sql
      data-locations: classpath:task2-seed.sql
