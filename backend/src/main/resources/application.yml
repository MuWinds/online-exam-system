spring:
  application:
    name: online-exam-system
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  sql:
    init:
      mode: never
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
app:
  jwt:
    secret: ${JWT_SECRET:local-development-secret-change-me}
    expire-seconds: ${JWT_EXPIRE_SECONDS:7200}
  default-password: ${DEFAULT_PASSWORD:123456}
server:
  address: 127.0.0.1
  port: 8080
